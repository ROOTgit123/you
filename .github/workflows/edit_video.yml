name: Edit YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      timeline:
        description: '=timeline list'
        default: '01:10-01:15, 03:20-03:35'
        required: true
      download_method:
        description: 'Download Method (auto, yt-dlp-android, you-get, yt-dlp-aria2c)'
        default: 'auto'
        required: true

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
          pip install -r requirements.txt

      - name: Create cookies file
        env:
          COOKIES_SECRET: ${{ secrets.COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
          fi

      - name: Run video editing script
        run: python edit_video.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.timeline }}" "${{ github.event.inputs.download_method }}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_video
          path: final_video.mp4
