name: Edit YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      timeline:
        description: '=timeline list'
        default: '01:10-01:15, 03:20-03:35'
        required: true

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run video editing script
        run: python edit_video.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.timeline }}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_video
          path: final_video.mp4
