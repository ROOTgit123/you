name: Edit YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      timeline:
        description: 'Timeline list (e.g., 01:10-01:15, 03:20-03:35)'
        required: true

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches based on requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install yt-dlp moviepy # Adding common video libs
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run video editing script
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          TIMELINE: ${{ github.event.inputs.timeline }}
        run: python edit_video.py "$VIDEO_URL" "$TIMELINE"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: edited-video-${{ github.run_id }}
          path: final_video.mp4
          retention-days: 5 # Saves space on your GitHub storage
